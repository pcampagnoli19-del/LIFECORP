/* ---------- folha de pagamento (CLT simplificada 2026) ---------- */
function calcINSS(s) {
  const f = [[1518, 0.075], [2793.88, 0.09], [4190.83, 0.12], [8157.41, 0.14]];
  let t = 0, prev = 0;
  for (const [lim, a] of f) { if (s > prev) { t += (Math.min(s, lim) - prev) * a; prev = lim; } }
  return t;
}
function calcIRRF(g, inss) {
  if (g <= 5000) return 0; // isenção até R$ 5 mil (reforma do IR, vigente desde 2026)
  const b = g - inss; let t;
  if (b <= 2428.80) t = 0; else if (b <= 2826.65) t = b * 0.075 - 182.16; else if (b <= 3751.05) t = b * 0.15 - 394.16;
  else if (b <= 4664.68) t = b * 0.225 - 675.49; else t = b * 0.275 - 908.73;
  if (g <= 7350) t -= (978.62 - 0.133145 * g);
  return Math.max(0, t);
}
function payroll(gross, type) {
  if (type === 'CLT' || type === 'estatutario') { const i = calcINSS(gross), r = calcIRRF(gross, i); return { inss: i, irrf: r, net: gross - i - r, fgts: type === 'CLT' ? gross * 0.08 : 0 }; }
  if (type === 'PJ') { const t = gross * 0.06, i = Math.min(gross * 0.11, 1518 * 0.11); return { inss: i, irrf: t, net: gross - t - i, fgts: 0 }; }
  return { inss: 0, irrf: 0, net: gross, fgts: 0 };
}
const TYPE_LABEL = { CLT: 'CLT', PJ: 'PJ', informal: 'Informal', estatutario: 'Estatutário', bolsa: 'Bolsa' };

/* ---------- orçamento mensal ---------- */
function kidCost(c) { if (!c.custody || c.age >= 18) return 0; return c.age < 6 ? 1100 : 900 + (c.school === 'particular' ? 2800 : 0); }
function alimony(c) { if (c.custody || c.age >= 18) return 0; return Math.max(500, Math.round(((S.job ? S.job.salary : 0) + (S.business ? Math.max(0, S.business.profitM) : 0)) * 0.15)); }
function budget() {
  const inc = [], exp = [];
  if (S.prison > 0) return { inc, exp, net: 0 };
  if (S.job) inc.push([`Salário líquido — ${S.job.title} (${TYPE_LABEL[S.job.type]})`, payroll(S.job.salary, S.job.type).net]);
  S.sideGigs.forEach(g => inc.push([g.name, g.monthly]));
  if (S.business) inc.push([`Lucro: ${S.business.name}`, S.business.profitM]);
  if (S.retired) inc.push(['Aposentadoria do INSS', S.retired.pension]);
  if (S.unemp.months > 0) inc.push([`Seguro-desemprego (${S.unemp.months} parcela(s))`, S.unemp.value]);
  if (married() && S.partner.income > 0) inc.push([`Contribuição de ${S.partner.name.split(' ')[0]}`, Math.round(S.partner.income * 0.4)]);
  if (S.age >= 10 && S.age < 18 && parentsAlive()) { const m = { pobre: 0, media: 150, rica: 800 }[S.familyClass]; if (m) inc.push(['Mesada dos pais', m]); }
  if (S.inv.fii > 0) inc.push(['Dividendos de FIIs', Math.round(S.inv.fii * 0.0075)]);
  if (S.age >= 18) {
    const totalInc = sum(inc.map(x => x[1]));
    const life = Math.round(Math.max(0, totalInc - 4000) * 0.22);
    if (life > 0) exp.push(['Padrão de vida (delivery, roupas, lazer, assinaturas)', life]);
    if (S.housing.kind === 'pais') { if (S.job || S.business) exp.push(['Ajuda nas contas da casa dos pais', 450]); }
    else exp.push(['Custo de vida (mercado, luz, internet, transporte)', 1400 + (married() ? 800 : 0)]);
  }
  if (S.housing.kind === 'aluguel') exp.push([`Aluguel — ${S.housing.name}`, S.housing.rent]);
  if (S.home) { if (S.home.fin) exp.push(['Parcela do financiamento imobiliário', S.home.fin.payment]); exp.push(['IPTU + condomínio', Math.round(S.home.value * 0.0011)]); }
  S.vehicles.forEach(v => exp.push([`Combustível/manutenção — ${v.name}`, v.maint]));
  S.children.forEach(c => { const k = kidCost(c); if (k) exp.push([`Criação de ${c.name.split(' ')[0]} (${c.age < 6 ? 'creche/saúde' : 'escola ' + c.school})`, k]); const a = alimony(c); if (a) exp.push([`Pensão alimentícia — ${c.name.split(' ')[0]}`, a]); });
  if (S.uni && S.uni.payer === 'self') exp.push([`Mensalidade — ${S.uni.uniName}`, S.uni.fee]);
  if (!S.uni && S.fies.debt > 0 && S.fies.payment > 0) exp.push(['Parcela do FIES', Math.min(S.fies.payment, S.fies.debt)]);
  const net = sum(inc.map(x => x[1])) - sum(exp.map(x => x[1]));
  return { inc, exp, net };
}

function netWorth() {
  const inv = sum(Object.values(S.inv));
  const home = S.home ? S.home.value - (S.home.fin ? S.home.fin.balance : 0) : 0;
  const veh = sum(S.vehicles.map(v => v.value));
  const biz = S.business ? S.business.value : 0;
  return S.money + inv + S.fgts + home + veh + biz - S.fies.debt;
}

function startJob(def, opts = {}) {
  if (S.job) endJob('Pediu demissão', 'Saiu para assumir nova oportunidade.', 'quit');
  const company = opts.company || pick(def.cos || [def.org]);
  const title = opts.title || def.ladder[0];
  const lid = Date.now() + '' + rnd(100, 999);
  S.job = {
    id: def.id, field: opts.field || def.field, title, level: 0, ladder: def.ladder, step: def.step || 1.3,
    company, salary: Math.round(opts.salary || def.base), type: opts.type || def.type, start: S.year, years: 0,
    perf: 50, fgtsJob: 0, stress: def.stress || 5, lid, residency: opts.residency || null
  };
  S.linkedin.push({ id: lid, company, title, start: S.year, end: null, status: 'Atual', type: S.job.type, field: S.job.field, salary: S.job.salary, ach: [`Contratad${oa()} como ${title} (${TYPE_LABEL[S.job.type]}) com salário de ${brl(S.job.salary)}/mês.`] });
  addLog(`💼 Novo emprego: <b>${title}</b> em ${esc(company)} — ${brl(S.job.salary)}/mês (${TYPE_LABEL[S.job.type]}).`, 'text-emerald-300');
}
function liEntry(lid) { return S.linkedin.find(e => e.id === lid); }
function liAch(text) { if (!S.job) return; const e = liEntry(S.job.lid); if (e) e.ach.push(text); }

/* mode: quit | fired | justa | retire | prison | residency */
function endJob(statusText, note, mode) {
  if (!S.job) return '';
  const j = S.job; let out = '';
  const e = liEntry(j.lid);
  if (e) { e.end = S.year; e.status = 'Anterior'; e.title = j.title; e.salary = j.salary; e.ach.push(`${note} ${j.years} ano(s) na casa, desempenho final ${Math.round(j.perf)}/100.`); e.exit = statusText; }
  if (j.type === 'CLT') {
    if (mode === 'fired') {
      const multa = j.fgtsJob * 0.4, aviso = payroll(j.salary, 'CLT').net;
      const saque = S.fgts + multa;
      S.money += saque + aviso; S.fgts = 0;
      if (j.years >= 1) S.unemp = { months: j.years >= 2 ? 5 : 4, value: Math.round(Math.min(2424, Math.max(1518, j.salary * 0.8))) };
      out = `Demissão sem justa causa: você sacou o FGTS (${brl(saque - multa)}) + multa de 40% (${brl(multa)}) + aviso prévio (${brl(aviso)}).${j.years >= 1 ? ` Seguro-desemprego: ${S.unemp.months}x ${brl(S.unemp.value)}.` : ''}`;
    } else if (mode === 'justa') out = 'Justa causa: sem multa, sem saque do FGTS, sem seguro-desemprego. O FGTS fica retido.';
    else if (mode === 'quit') out = 'Pedido de demissão: sem multa de 40% e o FGTS fica retido na conta.';
  }
  addLog(`📤 Saiu de ${esc(j.company)} (${j.title}) — ${statusText}. ${out}`, 'text-slate-300');
  S.job = null;
  return out;
}

function fireJob(reason, justa = false) { return endJob(justa ? 'Demitid' + oa() + ' por justa causa' : 'Demitid' + oa(), reason, justa ? 'justa' : 'fired'); }

function promote() {
  const j = S.job;
  if (!j || j.level >= j.ladder.length - 1) return false;
  j.level++; j.title = j.ladder[j.level];
  const old = j.salary;
  j.salary = Math.round(j.salary * (j.step + Math.random() * 0.15));
  j.perf = 55;
  liAch(`🚀 Promovid${oa()} a ${j.title} em ${S.year} (${brl(old)} → ${brl(j.salary)}).`);
  const e = liEntry(j.lid); if (e) e.title = j.title;
  addLog(`🚀 PROMOÇÃO! Agora você é <b>${j.title}</b> (${brl(j.salary)}/mês).`, 'text-emerald-300');
  return true;
}

function goPrison(years, reason) {
  S.prison = years;
  if (S.job) endJob('Pres' + oa(), 'Vínculo encerrado após prisão.', 'justa');
  S.sideGigs = [];
  addLog(`🚔 Você foi condenad${oa()} a ${years} ano(s) de prisão: ${reason}.`, 'text-rose-400');
  if (S.partner && chance(0.5)) { addLog(`💔 ${esc(S.partner.name)} não aguentou e terminou com você enquanto estava pres${oa()}.`, 'text-rose-300'); dumpPartner(false); }
}

function die(cause) {
  if (!S.alive) return;
  S.alive = false; S.death = { age: S.age, year: S.year, cause };
  addLog(`⚰️ Você faleceu aos ${S.age} anos: ${cause}.`, 'text-rose-400');
  Q = [];
}

function marketYear() {
  const m = S.market;
  m.selic = Math.round(clamp(m.selic + gauss() * 1.3, 2, 16) * 100) / 100;
  m.bolsa = Math.round((gauss() * 22 + 5) * 10) / 10;
  m.fii = Math.round((gauss() * 9 - 1) * 10) / 10;
  if (chance(0.06)) { m.bolsa = -rnd(25, 45); m.crash = true; } else m.crash = false;
}

function ageUp() {
  if (!S || !S.alive) return;
  if (!$('modal').classList.contains('hidden')) return;
  const invBefore = sum(Object.values(S.inv));
  S.age++; S.year++;
  S.energy = ENERGY_PER_YEAR;
  logEntry();
  marketYear();

  /* ----- meses ----- */
  let yInc = 0, yExp = 0;
  for (let m = 0; m < 12; m++) {
    const b = budget();
    S.money += b.net; yInc += sum(b.inc.map(x => x[1])); yExp += sum(b.exp.map(x => x[1]));
    if (!S.uni && S.fies.debt > 0 && S.fies.payment > 0) { S.fies.debt = Math.max(0, S.fies.debt - S.fies.payment); if (!S.fies.debt) { S.fies.payment = 0; addLog('🎓 FIES quitado!'); } }
    if (S.job && S.prison === 0) { const p = payroll(S.job.salary, S.job.type); if (p.fgts) { S.fgts += p.fgts; S.job.fgtsJob += p.fgts; } }
    if (S.home && S.home.fin) {
      const f = S.home.fin, i = f.balance * f.rate;
      f.balance = Math.max(0, f.balance - (f.payment - i)); f.months--;
      if (f.balance <= 1 || f.months <= 0) { S.home.fin = null; addLog('🏠 Você QUITOU o financiamento do imóvel!', 'text-emerald-300'); }
    }
    const iv = S.inv, mk = S.market;
    // valores em termos reais: desconta-se inflação (~4,5% a.a.) dos rendimentos
    iv.cdb *= 1 + Math.max(0, mk.selic * 0.85 - 4.5) / 100 / 12;
    iv.tesouro *= 1 + Math.max(0, (mk.selic + 0.4) * 0.85 - 4.5) / 100 / 12 + gauss() * 0.002;
    iv.acoes *= Math.pow(1 + mk.bolsa / 100, 1 / 12) * (1 + gauss() * 0.025);
    iv.fii *= Math.pow(1 + mk.fii / 100, 1 / 12);
    if (S.unemp.months > 0) S.unemp.months--;
    if (S.money < 0) S.money *= 1.015; // juros do cheque especial/cartão
  }
  const invAfter = sum(Object.values(S.inv));
  S.lastYear = { inc: yInc, exp: yExp, inv: invAfter - invBefore };
  if (S.money < -1000) { addLog(`💳 Você está no vermelho (${brl(S.money)}). Juros do cheque especial estão te engolindo.`, 'text-rose-300'); fx({ stress: 8, happy: -4 }); }

  /* ----- fim de ano: 13º, férias, IPVA ----- */
  if (S.job && S.prison === 0 && (S.job.type === 'CLT' || S.job.type === 'estatutario')) {
    const d13 = payroll(S.job.salary, S.job.type).net, fer = S.job.salary / 3 * 0.85;
    S.money += d13 + fer;
    if (S.job.type === 'CLT') { S.fgts += S.job.salary * 0.08; S.job.fgtsJob += S.job.salary * 0.08; }
    addLog(`💰 13º salário (${brl(d13)}) + 1/3 de férias (${brl(fer)}) caíram na conta. 30 dias de férias!`, 'text-emerald-300');
    S.st.stress = clamp(S.st.stress - 6);
  }
  if (S.vehicles.length) {
    const ipva = sum(S.vehicles.map(v => v.value * 0.04));
    S.money -= ipva;
    S.vehicles.forEach(v => v.value = Math.round(v.value * 0.9));
    addLog(`🚗 IPVA + licenciamento pagos: ${brl(ipva)}.`);
  }
  if (S.home) S.home.value = Math.round(S.home.value * (1 + (gauss() * 4 + 4) / 100));
  if (S.market.crash && S.inv.acoes > 0) addLog('📉 CRASH NA BOLSA! O Ibovespa derreteu este ano.', 'text-rose-300');

  /* ----- prisão ----- */
  if (S.prison > 0) {
    S.prison--;
    addLog(S.prison > 0 ? `🔒 Mais um ano atrás das grades. Faltam ${S.prison} ano(s).` : '🔓 Você cumpriu sua pena e foi solt' + oa() + '!', S.prison > 0 ? 'text-rose-300' : 'text-emerald-300');
    fx({ happy: -8, stress: 6, health: -2 });
  }

  /* ----- família ----- */
  S.family.parents.concat(S.family.siblings).forEach(p => {
    if (!p.alive) return;
    p.age++;
    const pd = p.age > 60 ? (p.age - 60) * 0.008 : 0.001;
    if (chance(pd)) {
      p.alive = false;

        if (h > 100 && S.age >= 18) { S.money += h; addLog(`📜 Herança recebida: ${brl(h)}.`); }

  if (S.partner) {

  S.children.forEach(c => {

  if (S.flags.babyDue) { S.flags.babyDue = 0; newChild(true); }

  /* ----- escola ----- */

  if (inSchool() && S.age >= 6) {
    const g = r10(S.st.smarts / 10 * 0.55 + 3.2 + S.studyBoost * 0.7 - (S.st.stress > 70 ? 1.2 : 0) + (S.familyClass === 'rica' ? 0.4 : 0) + gauss() * 1.1);
    S.grades.push({ age: S.age, label: schoolLabel(S.age), g });

    if (g >= 8.5) fx({ happy: 4 }); if (g < 5) fx({ happy: -4, stress: 4 });

  } else if (S.age === 18 && !S.highSchool && !S.flags.droppedSchool) { S.highSchool = true; }
  S.studyBoost = 0;

  /* ----- faculdade ----- */
  if (S.uni && S.prison === 0) {

      if (S.job && S.job.id === 'estagio') endJob('Estágio concluído', 'Encerrou o estágio ao se formar.', 'quit');

    } else addLog(`📚 ${u.done}º ano de ${COURSES[u.course].name} concluído (CR ${cr.toFixed(1)}).`);
  }

  /* ----- trabalho ----- */
  if (S.job && S.prison === 0) {
    const j = S.job; j.years++;
    S.salarySum += j.salary; S.salaryYears++;
    if (['CLT', 'PJ', 'estatutario'].includes(j.type)) S.contribYears++;
    j.perf = clamp(j.perf + gauss() * 6 + sum(perfFactors().map(p => p[1])));
    S.workBoost = 0;
    fx({ stress: j.stress - 4 });
    if (j.residency) {
      j.residency.left--;
      if (j.residency.left <= 0) {
        S.flags.specialty = j.residency.spec;

        addLog(`🩺 Você agora é especialista em <b>${S.flags.specialty}</b>! Procure vagas de Médico(a) Especialista.`, 'text-emerald-300');
      }
    } else {
      if (j.type === 'informal') { j.salary = Math.max(300, Math.round(j.salary * (0.82 + Math.random() * 0.4))); }
      else if (j.type !== 'bolsa') { const d = 1.005 + Math.random() * 0.02; j.salary = Math.round(j.salary * d); } // aumento real (acima da inflação)
      if (j.perf > 74 && chance(0.45)) promote();
      else if (j.type === 'estatutario' && j.years % 5 === 0 && j.level < j.ladder.length - 1) promote();
      if (S.job) {
        if (j.type === 'estatutario') { if (j.perf < 5 && chance(0.1)) { fireJob('Exonerad' + oa() + ' após processo administrativo.', true); } }
        else if (j.perf < 25 && chance(0.45)) { const r = fireJob('Desempenho abaixo do esperado.', false); addLog('Você foi demitid' + oa() + ' por desempenho. ' + r, 'text-rose-300'); fx({ happy: -12, stress: 8 }); }
      }
    }
  } else if (!S.job && S.age >= 18 && S.age < 60 && !S.uni && !S.retired && !S.business && S.prison === 0) { fx({ stress: 3, happy: -3 }); }
  else fx({ stress: -4 });

  /* ----- negócio próprio ----- */
  if (S.business && S.prison === 0) {
    const b = S.business, def = BUSINESSES.find(x => x.id === b.id);
    b.years++;
    b.rep = clamp(b.rep + gauss() * 8 + (S.st.smarts - 50) / 20 + (def.boost && hasDegree(def.boost) ? 3 : 0));
    b.profitM = Math.round(def.base * (b.rep / 50 - 0.45 + gauss() * def.vol * 0.5));
    // valuation converge para um múltiplo do lucro anual (startups valem mais múltiplos, mas não infinito)
    const target = Math.max(def.cost * 0.3, b.profitM * 12 * (b.id === 'startup' ? 18 : 4));
    b.value = Math.max(0, Math.round(b.value + (target - b.value) * 0.4 + b.value * gauss() * def.vol * 0.12));
    S.contribYears++;
    fx({ stress: 5 });
    addLog(`🏪 ${b.name}: reputação ${Math.round(b.rep)}/100, lucro de ${brl(b.profitM)}/mês, valor estimado ${brl(b.value)}.`);
    if (b.rep < 8 && chance(0.6)) { addLog(`💥 ${b.name} faliu.`, 'text-rose-300'); const e = liEntry(b.lid); if (e) { e.end = S.year; e.status = 'Anterior'; e.ach.push('Empresa encerrou as atividades (falência).'); } S.business = null; fx({ happy: -15, stress: 15 }); }
  }

  /* ----- saúde ----- */
  if (S.age > 45) fx({ health: -rnd(0, 2) });
  if (S.age > 65) fx({ health: -rnd(1, 4), looks: -rnd(0, 2) });
  if (S.age > 30) fx({ looks: -rnd(0, 1) });
  if (S.age < 25 && S.age > 3) fx({ health: rnd(0, 2) });
  S.illnesses = S.illnesses.filter(i => {
    const p = S.age < 18 && parentsAlive() ? 0.6 : 0.25; // menores: os pais levam ao médico
    if (chance(p)) { addLog(`🩹 Você se recuperou de ${i.name}.`, 'text-emerald-300'); return false; }
    return true;
  });
  S.illnesses.forEach(i => fx({ health: -Math.ceil(i.drain * 0.6), happy: -1 }));
  if (!S.illnesses.length && S.st.health < 60 && S.age < 70) fx({ health: rnd(1, 4) });
  // regressão natural: o corpo e a mente se recuperam um pouco a cada ano
  S.st.stress = clamp(S.st.stress + (25 - S.st.stress) * 0.18);
  S.st.happy = clamp(S.st.happy + (55 - S.st.happy) * 0.08);
  if (S.st.stress > 80) { fx({ health: -3, happy: -4 }); if (chance(0.15)) addIllness(pick(['Gastrite nervosa', 'Pressão alta', 'Burnout'])); }
  if (S.st.happy < 15 && S.age > 12) { fx({ health: -3 }); addLog('🌧️ Você anda muito pra baixo. Talvez terapia ajude.', 'text-slate-400'); }

  /* ----- morte ----- */
  if (S.st.health <= 0) die(S.illnesses.length ? `complicações de ${S.illnesses[0].name.toLowerCase()}` : 'saúde debilitada');
  else if (S.age >= 50 && chance(0.35 / (1 + Math.exp(-(S.age - lifeExpectancy().total) / 3)))) die(pick(['causas naturais, dormindo tranquilamente', 'parada cardíaca', 'causas naturais após um almoço de domingo', 'AVC', 'complicações da idade']));
  else if (S.age >= 112) die('velhice extrema (recorde brasileiro!)');
  else if (chance(0.0015)) die(pick(['um coco que caiu na sua cabeça na praia', 'acidente bizarro com um patinete elétrico', 'engasgo com pão de queijo']));

  /* ----- marcos ----- */
  if (S.age === 18) addLog('🔞 Maioridade! Agora você pode trabalhar, morar sozinh' + oa() + ', dirigir e se endividar legalmente.', 'text-violet-300');
  if (S.age === 16) addLog('🗳️ Você já pode tirar título de eleitor.');
  if (S.age >= 18 && S.prospects.length && chance(0.4)) S.prospects.shift();

  /* ----- eventos ----- */
  if (S.alive && S.prison === 0) rollEvents();
  else if (S.alive && S.prison > 0 && chance(0.4)) Q.push({ id: 'cadeia', t: 'Na cadeia, um colega de cela te chamou para entrar na facção.', ch: [{ l: 'Recusar educadamente', f: () => 'Você levou uns tapas, mas manteve a dignidade.' + fx({ health: -6 }) }, { l: 'Ler livros pra reduzir pena', f: () => { if (chance(0.5) && S.prison > 0) S.prison--; return 'Remição pela leitura: 4 dias a menos por livro. Você leu 30!' + fx({ smarts: 6 }); } }] });

  render();
  save();
  processQueue();
}

function rollEvents() {
  let pool = EVENTS.filter(e => S.age >= e.a[0] && S.age <= e.a[1] && !(e.once && S.seen[e.id]) && (!e.c || safeCond(e.c)));
  const n = S.age < 3 ? (chance(0.6) ? 1 : 0) : chance(0.45) ? 1 : chance(0.65) ? 2 : 3;
  for (let i = 0; i < n && pool.length; i++) {
    const tot = sum(pool.map(e => e.w || 1));
    let r = Math.random() * tot, idx = 0;
    for (; idx < pool.length; idx++) { r -= pool[idx].w || 1; if (r <= 0) break; }
    const ev = pool[Math.min(idx, pool.length - 1)];
    pool = pool.filter(e => e !== ev);
    Q.push(ev);
  }
}
function safeCond(c) { try { return !!c(); } catch (e) { return false; } }

function processQueue() {
  if (!S.alive) { render(); save(); return gameOver(); }
  if (!Q.length) { render(); save(); return; }
  const ev = Q.shift();
  if (ev.c && !safeCond(ev.c)) return processQueue();
  if (ev.id) S.seen[ev.id] = 1;
  const text = typeof ev.t === 'function' ? ev.t() : ev.t;
  const title = `📅 ${S.age} anos — ${S.year}`;
  if (ev.ch) {
    modal(title, `<p class="text-lg leading-relaxed">${text}</p>`, ev.ch.map(c => ({ l: c.l, fn: () => {
      const r = c.f();
      addLog(`${text} → <i>${c.l}</i>. ${stripFx(r)}`);
      render(); save();
      if (r) modal('Resultado', `<div class="leading-relaxed">${r}</div>`, [{ l: 'Continuar', v: 'pri', fn: processQueue }]);
    } })));
  } else {
    const r = ev.f();
    addLog(`${text} ${stripFx(r)}`);
    render(); save();
    modal(title, `<p class="text-lg leading-relaxed">${text}</p><div class="mt-3 text-slate-300">${r}</div>`, [{ l: 'Continuar', v: 'pri', fn: processQueue }]);
  }
}
function stripFx(html) { return (html || '').replace(/<div class="fx">(.*?)<\/div>/g, ' <span class="text-slate-500">[$1]</span>').replace(/<div class="mt-2 text-rose-300">/g, '<span>').replace(/<\/div>/g, '</span>'); }

function meetPeople(place, count = 3) {
  const out = [];
  for (let i = 0; i < count; i++) {

    const age = Math.max(18, S.age + rnd(-6, 6));
    const looks = rnd(15, 98);
    out.push({
      id: 'p' + Date.now() + i + rnd(0, 999), name: rname(g), gender: g, age, looks, smarts: rnd(10, 98), place,
      attraction: clamp(Math.round(looks * 0.5 + rnd(0, 50))), compat: rnd(5, 99),
      income: chance(0.15) ? 0 : rnd(15, 150) * 100,
      job: pick(['Enfermeir@', 'Dev', 'Advogad@', 'Personal trainer', 'Vendedor@', 'Influencer', 'Estudante', 'Engenheir@', 'Professor@', 'Motorista de app', 'Empresári@', 'Dentista', 'Médic@', 'Artista', 'Concurseir@']).replace(/@/g, g === 'F' ? 'a' : g === 'M' ? 'o' : 'e')
    });
  }
  S.prospects = out.concat(S.prospects).slice(0, 6);
  return out;
}
function dumpPartner(toExes = true) { if (S.partner && toExes) S.exes.push({ name: S.partner.name, status: S.partner.status, year: S.year }); S.partner = null; }
function breakup(cheated = false, silent = false) {
  const p = S.partner; if (!p) return;
  if (p.status !== 'casado') {
    if (!silent) modal('Fim do namoro', `Você terminou com ${esc(p.name)}.${fx({ happy: -10, stress: 6 })}`, [{ l: 'Seguir em frente', v: 'pri' }]);
    else fx({ happy: -12 });
    addLog(`💔 Fim do relacionamento com ${esc(p.name)}.`, 'text-rose-300');
    dumpPartner(); return;
  }
  const doDivorce = (lit) => {
    const assets = Math.max(0, S.money) + sum(Object.values(S.inv));
    let share = 0, cost = 0, txt = '';
    if (lit) {
      cost = rnd(20, 90) * 1000;
      const win = chance(0.45 + (S.st.smarts - 50) / 200);
      share = p.regime === 'comunhao' ? (win ? 0.3 : 0.65) : (win ? 0 : 0.15);
      txt = `Divórcio LITIGIOSO: 2 anos de audiência, advogados caros (${brl(cost)}). ${win ? 'Você saiu na vantagem!' : 'O juiz ficou do lado de ' + esc(p.name.split(' ')[0]) + '.'}`;
      fx({ stress: 25, happy: -15 });
    } else {
      cost = 3500;
      share = p.regime === 'comunhao' ? 0.5 : 0;
      txt = `Divórcio amigável em cartório (${brl(cost)}).`;
      fx({ stress: 10, happy: -10 });
    }
    const loss = assets * share;
    if (loss > 0) { const ratio = loss / assets; S.money = S.money > 0 ? S.money * (1 - ratio) : S.money; for (const k in S.inv) S.inv[k] *= (1 - ratio); }
    S.money -= cost;
    if (S.home && p.regime === 'comunhao') { S.money += 0; txt += ' O imóvel foi partilhado: você ficou com ele, mas pagou metade da parte quitada ao ex.'; const eq = S.home.value - (S.home.fin ? S.home.fin.balance : 0); S.money -= eq * 0.5 * (lit ? share / 0.5 : 1); }
    let kidsTxt = '';
    S.children.filter(c => c.age < 18 && c.custody && c.other === p.name).forEach(c => { if (chance(0.55)) { c.custody = false; kidsTxt += ` A guarda de ${esc(c.name.split(' ')[0])} ficou com ${esc(p.name.split(' ')[0])} — você pagará pensão alimentícia.`; } });
    txt += ` Regime: ${p.regime === 'comunhao' ? 'comunhão parcial de bens' : 'separação total de bens'}. Partilha: você perdeu ${brl(loss)}.` + kidsTxt;
    addLog(`⚖️ Divórcio de ${esc(p.name)}. ${txt}`, 'text-rose-300');
    dumpPartner();
    render(); save();
    modal('Divórcio', txt, [{ l: 'Bola pra frente', v: 'pri' }]);
  };
  modal('Divórcio', `Como vai ser o divórcio com ${esc(p.name)}? (${p.regime === 'comunhao' ? 'Comunhão parcial de bens' : 'Separação total de bens'})`, [
    { l: 'Amigável (cartório)', v: 'pri', fn: () => { if (cheated || chance(0.35)) { modal('Não vai ser fácil...', `${esc(p.name.split(' ')[0])} se recusou a fazer amigável e contratou um advogado tubarão.`, [{ l: 'Ir pro litigioso', v: 'dan', fn: () => doDivorce(true) }]); } else doDivorce(false); } },
    { l: 'Litigioso (brigar na justiça)', v: 'dan', fn: () => doDivorce(true) }
  ]);
}
function proposeMarriage() {
  const p = S.partner;

function wed(regime, cost) {
  const p = S.partner; p.status = 'casado'; p.regime = regime; p.rel = clamp(p.rel + 15);

  const t = `Você se casou com ${esc(p.name)}! Regime: ${regime === 'comunhao' ? 'comunhão parcial de bens' : 'separação total de bens'}.`;
  addLog('💒 ' + t, 'text-pink-300');
  modal('💒 Casamento', t + fx({ happy: cost > 10000 ? 22 : 15, stress: cost > 10000 ? 8 : 2 }), [{ l: 'Felizes para sempre (?)', v: 'pri' }]);

}

/* ----- ENEM ----- */
function takeEnem() {
  if (blockedByPrison()) return;
  if (S.age < 16) return toast('Você ainda é muito nov' + oa() + ' para o ENEM.');
  if (S.flags.enemYear === S.year) return toast('O ENEM é só uma vez por ano!');
  if (!S.highSchool && S.age < 17) return toast('Faça o ENEM no 3º ano do Ensino Médio (17 anos) ou depois.');
  if (!useEnergy()) return;
  S.flags.enemYear = S.year;
  const avgGrade = S.grades.length ? S.grades.slice(-4).reduce((a, b) => a + b.g, 0) / Math.min(4, S.grades.length) : 5;
  const base = 330 + S.st.smarts * 3.6 + avgGrade * 14 + S.enemPrep * 18 - S.st.stress * 0.5 + (S.familyClass === 'rica' ? 15 : 0);
  // TRI simplificado: cada área tem dificuldade própria; acertos "chutados" valem menos
  const area = (bias, sd) => Math.round(clamp(base + bias + gauss() * sd, 300, 990));
  const areas = {
    'Linguagens': area(-10, 35), 'Ciências Humanas': area(0, 40), 'Ciências da Natureza': area(-25, 50), 'Matemática': area(15 + (S.st.smarts - 50) * 0.8, 65)
  };
  const redacao = Math.round(clamp((base - 150) * 1.15 + gauss() * 90, 0, 1000) / 20) * 20;
  const score = Math.round((sum(Object.values(areas)) + redacao) / 5);
  S.enem = { score, areas, redacao, year: S.year };
  if (!S.enemBest || score > S.enemBest) S.enemBest = score;
  addLog(`📝 ENEM ${S.year}: média <b>${score}</b> (redação ${redacao}).`, 'text-sky-300');
  fx({ stress: 6 });
  const rows = Object.entries(areas).map(([k, v]) => `<div class="flex justify-between"><span>${k}</span><b>${v}</b></div>`).join('') + `<div class="flex justify-between"><span>Redação</span><b>${redacao}</b></div>`;
  done('Resultado do ENEM', `<div class="space-y-1 text-sm">${rows}</div><div class="mt-3 text-2xl font-bold text-emerald-400">Média: ${score}</div><p class="mt-2 text-slate-400 text-sm">Veja o catálogo de faculdades na aba Carreira para usar sua nota no SISU/ProUni.</p>`);
}

    const fin = h.price - entrada, rate = (S.market.selic + 1.5) / 100 / 12, n = 360;

  else { amt = Math.min(amt, S.inv[kind]); if (amt <= 0) return toast('Nada aplicado aqui.'); S.inv[kind] -= amt; S.money += amt; addLog(`📉 Resgatou ${brl(amt)} de ${INV_META[kind].name}.`); }
  render(); save(); toast(dir > 0 ? `✅ Aplicado ${brl(amt)}` : `✅ Resgatado ${brl(amt)}`);
}

/* =========================================================
   PERSISTÊNCIA
   ========================================================= */
const SAVE_VERSION = 2;
const BACKUP_KEY = SAVE_KEY + '_backup';
let SAVE_WARNED = false;

function save() {
  if (!S) return false;
  try {
    S.v = SAVE_VERSION; S.savedAt = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    return true;
  } catch (e) {
    if (!SAVE_WARNED) { SAVE_WARNED = true; toast('⚠️ Não foi possível salvar: armazenamento do navegador bloqueado ou cheio. Use ⚙️ → Exportar save.'); }
    return false;
  }
}

/* Preenche campos ausentes (saves antigos) com os padrões atuais e valida o básico. */
function migrate(s) {
  if (!s || typeof s !== 'object' || !s.st || typeof s.age !== 'number' || typeof s.name !== 'string') return null;
  const base = newState({ name: s.name || 'Sem Nome', gender: s.gender || 'M', country: s.country || 'Brasil', familyClass: s.familyClass || 'media', health: 50, happy: 50, smarts: 50, looks: 50, stress: 20, moneyBonus: 0 });
  for (const k in base) {
    if (s[k] === undefined || s[k] === null && base[k] !== null) s[k] = base[k];
    else if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k]) && typeof s[k] === 'object' && !Array.isArray(s[k])) {
      for (const kk in base[k]) if (s[k][kk] === undefined) s[k][kk] = base[k][kk];
    }
  }
  for (const k of ['health', 'happy', 'smarts', 'looks', 'stress']) s.st[k] = clamp(Number(s.st[k]) || 0);
  if (!isFinite(s.money)) s.money = 0;
  for (const k in s.inv) if (!isFinite(s.inv[k])) s.inv[k] = 0;
  if (!Array.isArray(s.log)) s.log = [];
  s.v = SAVE_VERSION;
  return s;
}
function loadSave() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return null; }
  if (!raw) return null;
  try {
    const s = migrate(JSON.parse(raw));
    if (!s) throw new Error('save inválido');
    return s;
  } catch (e) {
    try { localStorage.setItem(BACKUP_KEY, raw); localStorage.removeItem(SAVE_KEY); } catch (e2) { }
    setTimeout(() => toast('⚠️ O save estava corrompido. Uma cópia foi guardada e um novo jogo foi aberto.'), 300);
    return null;
  }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }

function exportSave() {
  if (!S) return;
  try {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `lifecorp-${S.name.replace(/[^\p{L}\p{N}]+/gu, '-').toLowerCase()}-${S.age}anos.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('⬇️ Save exportado.');
  } catch (e) { toast('Não foi possível exportar neste navegador.'); }
}
function importSave() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    if (f.size > 5e6) return toast('Arquivo grande demais para ser um save.');
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const s = migrate(JSON.parse(rd.result));
        if (!s) throw new Error();
        closeModal(); S = s; Q = []; TAB = 'perfil'; ANIM_AGE = null; save(); render();
        toast(`📂 Vida de ${esc(S.name)} carregada (${S.age} anos).`);
        if (!S.alive) gameOver();
      } catch (e) { toast('❌ Arquivo inválido: não é um save do LifeCorp.'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function openMenu() {
  if (!S) return;
  const when = S.savedAt ? new Date(S.savedAt).toLocaleString('pt-BR') : '—';
  modal('⚙️ Menu do jogo', `<p class="text-sm text-slate-400">O jogo salva sozinho a cada ação e a cada ano. Último save: <b class="text-slate-200">${when}</b>.</p>`, [

function gtext(html, g) {
  g = g || (S && S.gender);

    .replace(/Juiz\(a\)/g, F ? 'Juíza' : 'Juiz')

    .replace(/ão\(ã\)/g, F ? 'ã' : 'ão')

}

  return `${yearCard}<div class="grid lg:grid-cols-[340px_1fr] gap-4">
    <div class="space-y-4">
      ${prison}
      ${card('Atributos', `<div class="space-y-3">${['health', 'happy', 'smarts', 'looks', 'stress'].map(bar).join('')}</div>${ill}`)}
      ${expCard}
      ${card('Status', `<div class="flex flex-wrap gap-1.5">${statusChips}</div>
        <div class="mt-3">${row('Gênero', { M: 'Masculino', F: 'Feminino', N: 'Não-binário' }[S.gender])}${row('Nascimento', `${S.birthYear} · ${S.country}`)}${row('Família', { pobre: 'Humilde', media: 'Classe média', rica: 'Rica' }[S.familyClass])}${row('Inglês', ['Nenhum', 'Básico', 'Intermediário', 'Fluente'][S.flags.english])}${row('Anos de contribuição INSS', S.contribYears)}</div>`)}
    </div>
    ${card('📜 Anos anteriores', log ? `<div>${log}</div>` : '<p class="text-sm text-slate-500">Sua história está só começando.</p>')}
  </div>`;
}

function renderLinkedin() {
  const headline = S.job ? `${S.job.title} @ ${esc(S.job.company)}` : S.retired ? 'Aposentad' + oa() + ' · Mentor(a) nas horas vagas' : S.business ? `Fundador(a) & CEO @ ${S.business.name}` : S.uni ? `Estudante de ${COURSES[S.uni.course].name} na ${S.uni.uniName}` : S.age < 16 ? 'Ainda é criança demais pro LinkedIn (mas a mãe já criou o perfil)' : '#OpenToWork · Em busca de novas oportunidades';
  const conns = Math.min(500, 3 + S.linkedin.length * 37 + S.degrees.length * 60 + Math.max(0, S.age - 16) * 4);
  const exp = [...S.linkedin].sort((a, b) => (b.end === null) - (a.end === null) || b.start - a.start).map(e => {
    const dur = (e.end || S.year) - e.start;
    return `<div class="flex gap-3 py-4 border-b border-slate-800 last:border-0">
      <div class="w-12 h-12 shrink-0 rounded-xl bg-slate-800 grid place-items-center text-lg">${e.field === 'Medicina' ? '🏥' : e.field === 'Odontologia' ? '🦷' : e.field === 'Tecnologia' ? '💻' : e.field === 'Direito' ? '⚖️' : e.field === 'Serviço Público' ? '🏛️' : e.field === 'Empreendedorismo' ? '🚀' : e.field === 'Artes' ? '🎨' : e.field === 'Educação' ? '📚' : '🏢'}</div>
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-2"><span class="font-semibold">${esc(e.title)}</span>${e.status === 'Atual' ? chip('Atual', 'bg-emerald-900/60 text-emerald-200') : chip(e.exit || 'Anterior')}</div>
        <div class="text-sm text-slate-300">${esc(e.company)} · ${TYPE_LABEL[e.type] || e.type}</div>
        <div class="text-xs text-slate-500">${e.start} – ${e.end || 'o momento'} · ${dur < 1 ? 'menos de 1 ano' : dur + ' ano' + (dur > 1 ? 's' : '')}${e.salary ? ' · último salário ' + brl(e.salary) : ''}</div>
        <ul class="mt-2 space-y-1 text-sm text-slate-300 list-disc list-inside">${e.ach.map(a => `<li>${a}</li>`).join('')}</ul>
      </div></div>`;
  }).join('') || '<p class="text-sm text-slate-500">Nenhuma experiência ainda. Todo CEO começou como estagiário (ou herdeiro).</p>';
  const edu = [
    ...(S.uni ? [`<div class="py-3 border-b border-slate-800"><div class="font-semibold">${S.uni.uniName}</div><div class="text-sm text-slate-300">Bacharelado em ${COURSES[S.uni.course].name}</div><div class="text-xs text-slate-500">${S.uni.start} – ${S.uni.start + S.uni.years} (previsto) · cursando</div></div>`] : []),
    ...S.degrees.slice().reverse().map(d => `<div class="py-3 border-b border-slate-800"><div class="font-semibold">${d.uniName}</div><div class="text-sm text-slate-300">${COURSES[d.course].name}</div><div class="text-xs text-slate-500">${d.start} – ${d.end} · CR ${d.cr}</div></div>`),
    ...S.dropped.map(d => `<div class="py-3 border-b border-slate-800"><div class="font-semibold">${d.uniName}</div><div class="text-sm text-slate-300">${COURSES[d.course].name} (incompleto)</div><div class="text-xs text-slate-500">${d.start} – ${d.end}</div></div>`),
    S.highSchool ? `<div class="py-3"><div class="font-semibold">${S.school ? S.school.name : 'Ensino Médio'}</div><div class="text-sm text-slate-300">Ensino Médio completo</div>${S.grades.length ? `<div class="text-xs text-slate-500">Média geral ${(S.grades.reduce((a, b) => a + b.g, 0) / S.grades.length).toFixed(1)}${S.enemBest ? ' · Melhor ENEM: ' + S.enemBest : ''}</div>` : ''}</div>` : ''
  ].join('') || '<p class="text-sm text-slate-500">Sem formação registrada.</p>';
  const certs = [S.flags.crm && '🩺 CRM — Conselho Regional de Medicina', S.flags.specialty && `🩺 Título de especialista em ${S.flags.specialty}`, S.flags.cro && '🦷 CRO — Conselho Regional de Odontologia', S.flags.oab && '⚖️ OAB — Ordem dos Advogados do Brasil', S.flags.english >= 2 && `🇺🇸 Inglês ${S.flags.english === 3 ? 'fluente' : 'intermediário'}`, S.flags.obmep && '🥇 Medalha de Ouro OBMEP', S.flags.ic && '🔬 Iniciação Científica com artigo publicado'].filter(Boolean);
  const skills = [...new Set(S.linkedin.map(e => e.field).concat(S.degrees.map(d => COURSES[d.course].name)))];
  return `<div class="max-w-3xl mx-auto space-y-4">
    <section class="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden">
      <div class="h-24 bg-gradient-to-r from-sky-800 via-sky-600 to-emerald-600"></div>
      <div class="px-5 pb-5 -mt-10">
        <div class="w-20 h-20 rounded-full bg-slate-900 border-4 border-slate-900 grid place-items-center text-3xl font-bold bg-gradient-to-br from-emerald-500 to-sky-600">${esc(S.name[0] || '?').toUpperCase()}</div>
        <div class="mt-2 text-xl font-bold">${esc(S.name)} ${S.flags.oab ? '<span class="text-sm text-slate-400">· OAB</span>' : ''}${S.flags.specialty ? '<span class="text-sm text-slate-400">· Dr(a).</span>' : ''}</div>
        <div class="text-slate-300">${headline}</div>
        <div class="text-sm text-slate-500 mt-1">${esc(S.city)}, Brasil · <span class="text-sky-400">${conns}${conns >= 500 ? '+' : ''} conexões</span></div>
        ${!S.job && S.age >= 16 && S.alive ? `<div class="mt-3 inline-block px-3 py-1 rounded-full bg-emerald-900/50 border border-emerald-700 text-emerald-300 text-xs font-semibold">#OpenToWork</div>` : ''}
      </div>
    </section>
    ${card('Experiência', exp)}
    ${card('Formação acadêmica', edu)}
    ${certs.length ? card('Licenças e certificados', `<ul class="space-y-1.5 text-sm">${certs.map(c => `<li>${c}</li>`).join('')}</ul>`) : ''}
    ${skills.length ? card('Competências', `<div class="flex flex-wrap gap-1.5">${skills.map(s => chip(esc(s), 'bg-sky-900/40 text-sky-200')).join('')}</div>`) : ''}
  </div>`;
}

function renderCarreira() {
  const parts = [];
  /* Educação */
  let edu = '';
  if (S.age < 6) edu = '<p class="text-sm text-slate-400">Você ainda não está na escola. Aproveite a vida de bebê.</p>';
  else {
    edu += inSchool() ? `<div class="text-sm mb-2">🎒 <b>${S.school ? S.school.name : ''}</b> — ${schoolLabel(S.age)}</div>` : (S.highSchool ? '<div class="text-sm mb-2 text-emerald-300">✔ Ensino Médio completo</div>' : S.flags.droppedSchool ? '<div class="text-sm mb-2 text-rose-300">✖ Abandonou a escola (faça EJA em Atividades)</div>' : '');
    if (S.grades.length) edu += `<div class="flex gap-1 items-end h-16 mb-1">${S.grades.map(g => `<div title="${g.label}: ${g.g}" class="flex-1 rounded-t ${g.g >= 7 ? 'bg-sky-500' : g.g >= 5 ? 'bg-amber-500' : 'bg-rose-500'}" style="height:${Math.max(6, g.g * 10)}%"></div>`).join('')}</div><div class="text-xs text-slate-500 mb-3">Notas escolares por ano (0 a 10). Última: ${S.grades[S.grades.length - 1].g.toFixed(1)}</div>`;
    if (S.uni) { const u = S.uni; edu += `<div class="p-3 rounded-xl bg-slate-950 border border-slate-800 mb-3"><div class="font-semibold">${COURSES[u.course].icon} ${COURSES[u.course].name} — ${u.uniName}</div><div class="text-sm text-slate-400">${u.done}/${u.years} anos concluídos · ${u.payer === 'publica' ? 'Pública' : u.payer === 'prouni' ? 'ProUni' : u.payer === 'fies' ? 'FIES' : u.payer === 'pais' ? 'Pais pagam' : 'Você paga'}${u.fee && u.payer !== 'publica' ? ' · ' + brl(u.fee) + '/mês' : ''}${u.cr.length ? ' · CR ' + (u.cr.reduce((a, b) => a + b, 0) / u.cr.length).toFixed(1) : ''}</div><div class="mt-2">${btn('🚪 Trancar curso', 'G.dropUni()', 'def')}</div></div>`; }
  }
  if (S.age >= 16) {
    edu += `<div class="flex flex-wrap gap-2 items-center">${btn('📝 Fazer o ENEM', 'G.enem()', 'sky', S.flags.enemYear === S.year || S.prison > 0)}${S.enem ? `<span class="text-sm text-slate-400">Último ENEM (${S.enem.year}): <b class="text-slate-100">${S.enem.score}</b> · Preparação: ${S.enemPrep}/6</span>` : `<span class="text-sm text-slate-400">Preparação: ${S.enemPrep}/6 (cursinho em Atividades)</span>`}</div>`;
    if (hasDegree('direito') || (S.uni && S.uni.course === 'direito')) edu += `<div class="mt-2">${btn('⚖️ Exame da OAB (R$ 300)', 'G.oab()', 'def', !!S.flags.oab)}</div>`;
    if (hasDegree('medicina')) edu += `<div class="mt-2">${btn('🩺 Prova de Residência Médica', 'G.residency()', 'def', !!S.flags.specialty || !!(S.job && S.job.residency))}</div>`;
  }
  parts.push(card('🎓 Educação', edu));

  /* catálogo */
  if (S.age >= 16) {
    const valid = S.enem && S.enem.year >= S.year - 1;
    const cat = Object.entries(COURSES).map(([cid, c]) => {
      const unis = UNIS.filter(u => uniOffers(u, cid)).map(u => {
        const cut = uniCut(u, cid), fee = uniFee(u, cid), ok = valid && S.enem.score >= cut && !S.uni && !hasDegree(cid) && S.prison === 0;
        return `<button ${ok ? '' : 'disabled'} onclick="G.enroll('${cid}','${u.id}')" class="text-left px-2.5 py-1.5 rounded-lg border text-xs transition ${ok ? 'border-emerald-600 bg-emerald-900/30 hover:bg-emerald-800/40' : 'border-slate-800 bg-slate-950 opacity-70 cursor-not-allowed'}">
          <div class="font-semibold">${u.name} ${u.type === 'pub' ? '<span class="text-sky-400">pública</span>' : ''}</div><div class="text-slate-400">corte ${cut}${fee ? ' · ' + brl(fee) + '/mês' : ' · grátis'}</div></button>`;
      }).join('');
      return `<div class="py-3 border-b border-slate-800 last:border-0"><div class="font-semibold mb-2">${c.icon} ${c.name} <span class="text-xs text-slate-500 font-normal">${c.years} anos</span></div><div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-1.5">${unis}</div></div>`;
    }).join('');
    parts.push(card('🏛️ Catálogo de faculdades (SISU / ProUni / FIES)', `<p class="text-xs text-slate-400 mb-2">${valid ? `Sua nota válida: <b class="text-emerald-300">${S.enem.score}</b>. Opções em verde estão ao seu alcance.` : 'Faça o ENEM para liberar as inscrições (nota vale por 2 anos).'} Públicas são gratuitas; particulares aceitam ProUni (nota alta e família não-rica), FIES ou pagamento direto.</p>${cat}`));
  }

  /* emprego atual */
  if (S.job) {
    const j = S.job, p = payroll(j.salary, j.type);
    parts.push(card('💼 Emprego atual', `<div class="flex flex-wrap items-start justify-between gap-2 mb-3"><div><div class="text-lg font-semibold">${j.title}</div><div class="text-sm text-slate-400">${esc(j.company)} · desde ${j.start} · ${TYPE_LABEL[j.type]}</div></div>${chip(j.residency ? `Residência: falta(m) ${j.residency.left} ano(s)` : `Nível ${j.level + 1}/${j.ladder.length}`, 'bg-slate-800 text-slate-300')}</div>
      <div class="mb-3"><div class="flex justify-between text-sm mb-1"><span>📈 Desempenho</span><span class="font-mono">${Math.round(j.perf)}/100</span></div><div class="h-2.5 bg-slate-800 rounded-full overflow-hidden"><div class="h-full ${j.perf > 70 ? 'bg-emerald-500' : j.perf > 35 ? 'bg-amber-500' : 'bg-rose-500'}" style="width:${j.perf}%"></div></div>
        <details class="mt-2 text-xs text-slate-400"><summary class="text-sky-400">Como o desempenho muda a cada ano</summary>
          <div class="mt-1">${perfFactors().map(([l, v]) => row(l, `<span class="${v >= 0 ? 'text-emerald-300' : 'text-rose-300'}">${v > 0 ? '+' : ''}${v.toFixed(1)}</span>`)).join('')}${row('Sorte do ano', '±6 (aleatório)')}</div>
          <p class="mt-1">Acima de 75: chance de promoção. Abaixo de 25: risco de demissão (servidor estatutário tem estabilidade).</p></details></div>
      <div class="grid sm:grid-cols-2 gap-x-6">${row('Salário bruto', brl(j.salary))}${p.inss ? row(j.type === 'PJ' ? 'INSS (pró-labore)' : 'INSS', '-' + brl(p.inss)) : ''}${p.irrf ? row(j.type === 'PJ' ? 'Simples Nacional (~6%)' : 'IRRF', '-' + brl(p.irrf)) : ''}${row('Salário líquido', `<b class="text-emerald-300">${brl(p.net)}</b>`)}${j.type === 'CLT' ? row('FGTS depositado/mês (8%)', brl(p.fgts)) + row('FGTS neste emprego', brl(j.fgtsJob)) : ''}${j.type === 'CLT' || j.type === 'estatutario' ? row('13º + férias', 'Pagos em dezembro') : row('13º / férias', '<span class="text-slate-500">Não tem</span>')}</div>
      <div class="flex flex-wrap gap-2 mt-4">${btn('💪 Trabalhar duro', "G.work('duro')")}${btn('☕ Puxar saco do chefe', "G.work('puxar')")}${btn('💸 Pedir aumento', "G.work('aumento')")}${btn('🚀 Pedir promoção', "G.work('promo')", 'def', j.level >= j.ladder.length - 1)}${btn('😴 Fazer corpo mole', "G.work('mole')")}${btn('🚪 Pedir demissão', 'G.quit()', 'dan')}</div>`));
  }
  if (S.sideGigs.length) parts.push(card('🧩 Rendas extras', S.sideGigs.map((g, i) => `<div class="flex items-center justify-between gap-2 py-1.5">${g.name} — ${brl(g.monthly)}/mês ${btn('Sair', `G.quitGig(${i})`, 'def')}</div>`).join('')));
  if (S.unemp.months > 0) parts.push(card('', `<div class="text-sm">🧾 Seguro-desemprego: ${S.unemp.months} parcela(s) de ${brl(S.unemp.value)}</div>`));

  /* vagas */
  if (S.age >= 14) {
    const list = JOBS.filter(d => d.id !== 'residente').map(d => {
      const ok = jobAvailable(d), cur = S.job && S.job.id === d.id;
      return `<div class="flex items-center gap-3 py-2.5 border-b border-slate-800 last:border-0 ${ok ? '' : 'opacity-50'}">
        <div class="min-w-0 flex-1"><div class="font-medium text-sm">${d.ladder[0]} <span class="text-xs text-slate-500">· ${d.field}</span></div><div class="text-xs text-slate-400">~${brl(d.base)}/mês · ${TYPE_LABEL[d.type]} · ${reqLabel(d.req, d.flag)}${d.minAge && d.minAge !== 18 ? ` · ${d.minAge}${d.maxAge ? '–' + d.maxAge : '+'} anos` : ''}${d.minSmarts ? ' · 🧠 ' + d.minSmarts + '+' : ''}${d.looksReq ? ' · ✨ ' + d.looksReq + '+' : ''}</div></div>
        ${btn(cur ? 'Atual' : 'Candidatar', `G.apply('${d.id}')`, ok && !cur ? 'pri' : 'def', !ok || cur || S.prison > 0)}</div>`;
    }).join('');
    parts.push(card('🔎 Vagas de emprego', list));
  }
  if (S.age >= 18) {
    parts.push(card('🏛️ Concursos públicos', `<p class="text-xs text-slate-400 mb-2">Estabilidade e regime estatutário. Preparação atual: <b>${S.concursoPrep}/8</b> (estude em Atividades). Taxa: R$ 150.</p>` + CONCURSOS.map(c => {
      const ok = concursoAvail(c);
      return `<div class="flex items-center gap-3 py-2.5 border-b border-slate-800 last:border-0 ${ok ? '' : 'opacity-50'}"><div class="min-w-0 flex-1"><div class="font-medium text-sm">${c.name}</div><div class="text-xs text-slate-400">${c.org} · ${brl(c.base)} · corte ${c.cut}/100 · ${reqLabel(c.req, c.flag)}</div></div>${btn('Prestar', `G.concurso('${c.id}')`, ok ? 'sky' : 'def', !ok || S.prison > 0 || (S.job && S.job.id === c.id))}</div>`;
    }).join('')));
    parts.push(card('🚀 Empreender', S.business ? (() => { const b = S.business; return `<div class="text-lg font-semibold">${b.name}</div><div class="text-sm text-slate-400 mb-2">Desde ${b.start}</div>${row('Reputação', Math.round(b.rep) + '/100')}${row('Lucro mensal', `<span class="${b.profitM < 0 ? 'text-rose-400' : 'text-emerald-300'}">${brl(b.profitM)}</span>`)}${row('Valor estimado', brl(b.value))}<div class="flex flex-wrap gap-2 mt-3">${btn('📣 Investir em marketing (R$ 5.000)', "G.biz('mkt')")}${btn('🤝 Vender negócio', "G.biz('sell')", 'warn')}</div>`; })() :
      BUSINESSES.map(b => { const ok = reqOk(b.req); return `<div class="flex items-center gap-3 py-2.5 border-b border-slate-800 last:border-0 ${ok ? '' : 'opacity-50'}"><div class="min-w-0 flex-1"><div class="font-medium text-sm">${b.name}</div><div class="text-xs text-slate-400">Investimento ${brl(b.cost)} · potencial ~${brl(b.base)}/mês · ${b.req ? reqLabel(b.req) : 'Sem requisito'} · risco ${b.vol > 0.8 ? 'altíssimo' : b.vol > 0.35 ? 'médio' : 'baixo'}</div></div>${btn('Abrir', `G.openBiz('${b.id}')`, ok ? 'warn' : 'def', !ok || S.money < b.cost || S.prison > 0)}</div>`; }).join('')));
    const minAge = S.gender === 'F' ? 62 : 65;
    parts.push(card('🏖️ Aposentadoria (INSS)', `<p class="text-sm text-slate-400 mb-2">Idade mínima: ${minAge} anos · Contribuição mínima: 15 anos · Você tem: <b class="text-slate-200">${S.contribYears} anos</b>. FGTS acumulado: <b class="text-slate-200">${brl(S.fgts)}</b> (saque na demissão sem justa causa, compra de imóvel ou aposentadoria).</p>${S.retired ? `<div class="text-emerald-300 text-sm">Aposentad${oa()} desde ${S.retired.year}: ${brl(S.retired.pension)}/mês</div>` : btn('Solicitar aposentadoria', 'G.retire()', 'def', S.age < minAge)}`));
  }
  return `<div class="space-y-4">${parts.join('')}</div>`;
}

function renderFinancas() {
  const b = budget();
  const inv = sum(Object.values(S.inv));
  const minor = S.age < 18;
  const resumo = card('📊 Patrimônio', `<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3">
      ${[['Dinheiro', S.money], ['Investimentos', inv], ['FGTS', S.fgts], ['Patrimônio líquido', netWorth()]].map(([l, v]) => `<div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><div class="text-xs text-slate-400">${l}</div><div class="font-mono font-semibold ${v < 0 ? 'text-rose-400' : 'text-slate-100'}">${brl(v)}</div></div>`).join('')}</div>
      ${S.home ? row('Imóvel: ' + S.home.name, brl(S.home.value) + (S.home.fin ? ` <span class="text-rose-300">(deve ${brl(S.home.fin.balance)})</span>` : '')) : ''}
      ${S.vehicles.length ? row('Veículos', brl(sum(S.vehicles.map(v => v.value)))) : ''}
      ${S.business ? row('Empresa', brl(S.business.value)) : ''}
      ${S.fies.debt > 0 ? row('Dívida FIES', `<span class="text-rose-300">${brl(S.fies.debt)}</span>`) : ''}
      ${row('Ano passado', `entrou ${brl(S.lastYear.inc)} · saiu ${brl(S.lastYear.exp)} · investimentos ${S.lastYear.inv >= 0 ? '+' : ''}${brl(S.lastYear.inv)}`)}`);
  const orc = card('🧾 Orçamento mensal', `${b.inc.length || b.exp.length ? '' : '<p class="text-sm text-slate-500">Sem receitas ou despesas próprias por enquanto.</p>'}
      ${b.inc.map(([l, v]) => row(l, `<span class="text-emerald-300">+${brl(v)}</span>`)).join('')}
      ${b.exp.map(([l, v]) => row(l, `<span class="text-rose-300">-${brl(v)}</span>`)).join('')}
      ${row('<b>Saldo mensal</b>', `<b class="${b.net < 0 ? 'text-rose-400' : 'text-emerald-400'}">${b.net >= 0 ? '+' : ''}${brl(b.net)}</b>`)}`);
  const moradia = card('🏠 Moradia', minor ? '<p class="text-sm text-slate-400">Você mora com sua família até os 18.</p>' : `
      <div class="text-sm mb-3">Atual: <b>${S.housing.kind === 'pais' ? 'Casa dos pais' : S.housing.kind === 'propria' ? S.home.name + ' (própria)' : S.housing.name + ' — ' + brl(S.housing.rent) + '/mês'}</b> ${S.housing.kind === 'aluguel' && parentsAlive() ? btn('Voltar pros pais', 'G.parents()', 'def', false, 'ml-2') : ''}</div>
      ${S.home ? `${row('Valor de mercado', brl(S.home.value))}${S.home.fin ? row('Saldo devedor', brl(S.home.fin.balance)) + row('Parcela', brl(S.home.fin.payment) + ` · ${S.home.fin.months} meses restantes`) : row('Financiamento', 'Quitado ✔')}<div class="mt-3">${btn('🏷️ Vender imóvel', 'G.sellHome()', 'warn')}</div>` : `
      <div class="text-xs text-slate-400 mb-1">ALUGAR (caução de 3 meses, renda mínima ~2,5x)</div>
      ${RENTALS.map(r => `<div class="flex items-center gap-2 py-2 border-b border-slate-800">${'<div class="flex-1 text-sm">' + r.name + '<div class="text-xs text-slate-500">' + brl(r.rent) + '/mês</div></div>'}${btn(S.housing.id === r.id ? 'Atual' : 'Alugar', `G.rent('${r.id}')`, 'def', S.housing.id === r.id)}</div>`).join('')}
      <div class="text-xs text-slate-400 mt-4 mb-1">COMPRAR (FGTS pode ser usado na entrada · financiamento 30 anos, parcela até 30% da renda)</div>
      ${HOMES.map(h => `<div class="flex flex-wrap items-center gap-2 py-2 border-b border-slate-800"><div class="flex-1 min-w-[160px] text-sm">${h.name}<div class="text-xs text-slate-500">${brl(h.price)} · entrada ${brl(h.price * 0.2)}</div></div>${btn('À vista', `G.buyHome('${h.id}',false)`, 'def')}${btn('Financiar', `G.buyHome('${h.id}',true)`, 'sky')}</div>`).join('')}`}`);
  const veic = card('🚗 Veículos', minor ? '<p class="text-sm text-slate-400">Só com CNH, aos 18.</p>' : `
      ${S.vehicles.map((v, i) => `<div class="flex items-center gap-2 py-2 border-b border-slate-800"><div class="flex-1 text-sm">${v.name}<div class="text-xs text-slate-500">valor ${brl(v.value)} · manutenção ${brl(v.maint)}/mês · IPVA ~${brl(v.value * 0.04)}/ano</div></div>${btn('Vender', `G.sellVehicle(${i})`, 'warn')}</div>`).join('') || '<p class="text-sm text-slate-500 mb-2">Você anda de ônibus/metrô.</p>'}
      <div class="text-xs text-slate-400 mt-3 mb-1">CONCESSIONÁRIA (à vista)</div>
      ${VEHICLES.map(v => `<div class="flex items-center gap-2 py-2 border-b border-slate-800"><div class="flex-1 text-sm">${v.name}<div class="text-xs text-slate-500">${brl(v.price)} · ${brl(v.maint)}/mês</div></div>${btn('Comprar', `G.buyVehicle('${v.id}')`, 'def', S.money < v.price)}</div>`).join('')}`);
  const m = S.market;
  const invc = card('📈 Investimentos', S.age < 16 ? '<p class="text-sm text-slate-400">A partir dos 16 anos.</p>' : `
      <div class="flex flex-wrap gap-2 text-xs mb-3">${chip('Selic: ' + m.selic.toFixed(2) + '% a.a.')}${chip('Ibovespa (ano): ' + (m.bolsa >= 0 ? '+' : '') + m.bolsa + '%', m.bolsa >= 0 ? 'bg-emerald-900/50 text-emerald-200' : 'bg-rose-900/50 text-rose-200')}${chip('IFIX (ano): ' + (m.fii >= 0 ? '+' : '') + m.fii + '%')}</div>
      <label class="block mb-3"><span class="text-xs text-slate-400">Valor (R$)</span><input id="inv-amt" inputmode="numeric" placeholder="ex: 5000" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 outline-none focus:border-emerald-500"></label>
      ${Object.entries(INV_META).map(([k, meta]) => `<div class="py-2.5 border-b border-slate-800 last:border-0"><div class="flex items-center justify-between gap-2"><div class="min-w-0"><div class="text-sm font-medium">${meta.name}</div><div class="text-xs text-slate-500">${meta.desc} · risco ${meta.risk}</div></div><div class="font-mono text-sm">${brl(S.inv[k])}</div></div><div class="flex gap-2 mt-2">${btn('Aplicar', `G.invest('${k}',1)`, 'pri', S.prison > 0)}${btn('Resgatar', `G.invest('${k}',-1)`, 'def', S.inv[k] <= 0)}</div></div>`).join('')}
      <p class="text-xs text-slate-500 mt-2">Todos os valores do jogo são em reais de hoje: os rendimentos já vêm descontados da inflação (~4,5% a.a.) e são aplicados mês a mês ao envelhecer. A bolsa sorteia o humor do mercado a cada ano (com chance de crash).</p>`);
  return `<div class="grid lg:grid-cols-2 gap-4">${resumo}${orc}${moradia}${veic}<div class="lg:col-span-2">${invc}</div></div>`;
}

function personCard(name, sub, rel, actions, extra = '') {
  return `<div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><div class="flex items-center justify-between gap-2"><div class="min-w-0"><div class="font-medium truncate">${name}</div><div class="text-xs text-slate-400">${sub}</div></div></div>
    ${rel != null ? `<div class="mt-2"><div class="flex justify-between text-xs mb-1"><span class="text-slate-400">Relacionamento</span><span>${Math.round(rel)}%</span></div><div class="h-1.5 bg-slate-800 rounded-full"><div class="h-full rounded-full bg-pink-500" style="width:${rel}%"></div></div></div>` : ''}${extra}
    ${actions ? `<div class="flex flex-wrap gap-1.5 mt-3">${actions}</div>` : ''}</div>`;
}
function renderRelacoes() {
  const fam = S.family.parents.map((p, i) => personCard(`${p.role}: ${esc(p.name)}`, p.alive ? `${p.age} anos` : `Falecid${p.role === 'Mãe' ? 'a' : 'o'}${p.note ? ' (' + p.note + ')' : ''}`, p.alive ? p.rel : null, p.alive ? btn('Passar tempo', `G.fam(${i},'time','par')`) + btn('Pedir dinheiro', `G.fam(${i},'money','par')`) + btn('Brigar', `G.fam(${i},'fight','par')`) : '')).join('') +
    S.family.siblings.map((p, i) => personCard(`${p.role}: ${esc(p.name)}`, p.alive ? `${p.age} anos` : 'Falecid' + oa(p.gender), p.alive ? p.rel : null, p.alive ? btn('Passar tempo', `G.fam(${i},'time','sib')`) + btn('Brigar', `G.fam(${i},'fight','sib')`) : '')).join('');
  const p = S.partner;
  const partner = p ? personCard(`${p.status === 'casado' ? '💍' : '❤️'} ${esc(p.name)}`, `${p.age} anos · ${p.job} · ${p.status === 'casado' ? 'Casad' + oa(p.gender) + ' (' + (p.regime === 'comunhao' ? 'comunhão parcial' : 'separação total') + ')' : 'Namorando há ' + (p.years || 0) + ' ano(s)'} · renda ~${brl(p.income)}/mês`, p.rel,
    btn('🍝 Encontro (R$ 300)', "G.partner('date')") + btn('🎁 Presente (R$ 800)', "G.partner('gift')") + btn('💬 Conversar', "G.partner('talk')") + btn('😤 Brigar', "G.partner('fight')") + (p.status === 'namoro' ? btn('💍 Pedir em casamento', "G.partner('propose')", 'vio') : '') + btn('👶 Ter filho', "G.partner('baby')", 'def') + btn('🧸 Adotar (R$ 5.000)', "G.partner('adopt')") + btn(p.status === 'casado' ? '⚖️ Divórcio' : '💔 Terminar', "G.partner('breakup')", 'dan'))
    : '<p class="text-sm text-slate-500">Solteir' + oa() + '. Bora conhecer gente?</p>';
  const kids = S.children.map((c, i) => personCard(`${c.gender === 'F' ? '👧' : '👦'} ${esc(c.name)}`, `${c.age} anos · ${c.age >= 18 ? 'Adult' + oa(c.gender) + ', saiu de casa' : c.custody ? (c.age < 6 ? 'Creche/primeira infância' : 'Escola ' + c.school) + ' · ' + brl(kidCost(c)) + '/mês' : 'Mora com ' + esc((c.other || 'ex').split(' ')[0]) + ' · pensão ' + brl(alimony(c)) + '/mês'}`, c.rel,
    btn('Passar tempo', `G.child(${i},'time')`) + btn('Dar R$ 1.000', `G.child(${i},'money')`) + (c.custody && c.age >= 6 && c.age < 18 ? btn(c.school === 'pública' ? 'Mudar p/ particular (+R$ 2.800)' : 'Mudar p/ pública', `G.child(${i},'school')`) : ''))).join('');
  const exes = S.exes.length ? `<div class="text-sm text-slate-400">${S.exes.map(e => `${esc(e.name)} <span class="text-slate-600">(${e.status === 'casado' ? 'ex-cônjuge' : 'ex'}, ${e.year})</span>`).join(' · ')}</div>` : '';
  const prospects = S.prospects.map(x => personCard(`${x.gender === 'F' ? '👩' : x.gender === 'M' ? '👨' : '🧑'} ${esc(x.name)}`, `${x.age} anos · ${x.job} · conheceu: ${x.place}`, null, btn(S.partner ? '😈 Ter um caso' : '💘 Chamar pra sair', `G.date('${x.id}')`, S.partner ? 'dan' : 'vio'),
    `<div class="grid grid-cols-3 gap-2 mt-2 text-xs"><div>✨ Aparência <b>${x.looks}</b></div><div>🔥 Atração <b>${x.attraction}</b></div><div>🧩 Compat. <b>${x.compat}</b></div></div>`)).join('');
  return `<div class="grid lg:grid-cols-2 gap-4">
    ${card('👨‍👩‍👧 Família', `<div class="grid gap-2">${fam}</div>`)}
    <div class="space-y-4">
      ${card('❤️ Relacionamento', partner + (exes ? `<div class="mt-3"><div class="text-xs text-slate-500 mb-1">Ex-relacionamentos</div>${exes}</div>` : ''))}
      ${card('👶 Filhos', kids ? `<div class="grid gap-2">${kids}</div>` : '<p class="text-sm text-slate-500">Nenhum filho (ainda).</p>')}
    </div>
    <div class="lg:col-span-2">${card('🌎 Conhecer pessoas', S.age < 16 ? '<p class="text-sm text-slate-400">Aos 16 anos libera.</p>' : `
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <select onchange="G.pref(this.value)" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm">${[['F', 'Interesse: mulheres'], ['M', 'Interesse: homens'], ['all', 'Interesse: todos']].map(([v, l]) => `<option value="${v}" ${S.pref === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        ${btn('🚶 Na rua', "G.meet('rua')")}${btn('🪩 Na balada', "G.meet('balada')")}${btn('🎓 Na faculdade', "G.meet('faculdade')", 'def', !S.uni)}${btn('💼 No trabalho', "G.meet('trabalho')", 'def', !S.job)}${btn('📱 App de namoro', "G.meet('app')")}${btn('⛪ Na igreja', "G.meet('igreja')")}
      </div>
      ${prospects ? `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">${prospects}</div>` : '<p class="text-sm text-slate-500">Ninguém por perto. Saia de casa!</p>'}`)}</div>
  </div>`;
}

function renderAtividades() {
  const cats = {};
  Object.entries(ACTIVITIES).forEach(([id, a]) => {
    if (S.age < a.min || S.age > a.max) return;
    if (a.c && !safeCond(a.c)) return;
    (cats[a.cat] = cats[a.cat] || []).push([id, a]);
  });
  const blocks = Object.entries(cats).map(([cat, list]) => card(cat, `<div class="grid sm:grid-cols-2 gap-2">${list.map(([id, a]) => {
    const dis = S.energy <= 0 || (a.cost && S.money < a.cost) || (S.prison > 0 && !['ler', 'meditar', 'correr', 'igreja'].includes(id));
    return `<button ${dis ? 'disabled' : ''} onclick="G.act('${id}')" class="text-left p-3 rounded-xl border border-slate-800 bg-slate-950 hover:border-emerald-600 transition disabled:opacity-40 disabled:cursor-not-allowed"><div class="font-medium text-sm">${a.l}</div><div class="text-xs text-slate-500">${a.d}</div></button>`;
  }).join('')}</div>`)).join('');
  return `<div class="space-y-4"><p class="text-sm text-slate-400">Cada atividade gasta ⚡1 de energia. Você tem <b class="text-amber-300">${S.energy}</b> neste ano.</p>${blocks || card('', '<p class="text-sm text-slate-400">Bebês só choram, mamam e dormem. Envelheça!</p>')}</div>`;
}

function gameOver() {
  const d = S.death || { age: S.age, cause: 'causa desconhecida' };
  const last = [...S.linkedin].sort((a, b) => b.start - a.start)[0];
  modal('⚰️ Fim da vida', `<div class="text-center"><div class="text-5xl mb-2">🪦</div><div class="text-xl font-bold">${esc(S.name)}</div><div class="text-slate-400">${S.birthYear} – ${S.year} · ${d.age} anos</div><div class="text-sm text-slate-400 mt-1">Causa: ${d.cause}</div></div>
    <div class="mt-4">${row('Patrimônio deixado', brl(netWorth()))}${row('Última ocupação', last ? esc(last.title) + ' — ' + esc(last.company) : 'Nenhuma')}${row('Empregos na carreira', S.linkedin.length)}${row('Diplomas', S.degrees.map(x => COURSES[x.course].name).join(', ') || 'Nenhum')}${row('Filhos', S.children.length)}${row('Cônjuge', S.partner ? esc(S.partner.name) : '—')}${row('Felicidade final', Math.round(S.st.happy) + '%')}</div>`,
    [{ l: '👶 Começar nova vida', v: 'pri', fn: () => G.newLife() }, { l: 'Ver o LinkedIn final', v: 'def', fn: () => { TAB = 'linkedin'; render(); } }]);
}

/* =========================================================
   API GLOBAL (onclick)
   ========================================================= */
window.G = {
  _mc: i => {
    const f = MFN[i]; closeModal(); if (f) f();
    // se nenhum novo modal abriu, continua a fila de eventos do ano
    if (S && $('modal').classList.contains('hidden')) { if (!S.alive) gameOver(); else if (Q.length) processQueue(); }
  },
  cset: (k, v) => { CREATE[k] = v; if (STAT_META[k]) { const el = $('v-' + k); if (el) el.textContent = v; } if (k === 'familyClass' || k === 'country') renderCreate(); },
  cRandName: () => { CREATE.name = rname(CREATE.gender); renderCreate(); },
  cRoll: () => { Object.assign(CREATE, rollAttrs()); renderCreate(); },
  start: () => {
    const name = (CREATE.name || '').trim();
    if (name.length < 2) return toast('Digite um nome.');
    S = newState(CREATE); Q = []; TAB = 'perfil';
    addLog(`👶 Você nasceu em ${S.city}, ${S.country}! ${S.gender === 'F' ? 'É uma menina' : S.gender === 'M' ? 'É um menino' : 'É um bebê'} de ${rnd(2, 4)},${rnd(1, 9)}kg.`, 'text-emerald-300');
    addLog(`Sua mãe é ${esc(S.family.parents[0].name)} (${S.family.parents[0].age}) e ${S.family.parents[1].alive ? `seu pai é ${esc(S.family.parents[1].name)} (${S.family.parents[1].age})` : 'seu pai ' + S.family.parents[1].note}. Família ${{ pobre: 'humilde', media: 'de classe média', rica: 'rica' }[S.familyClass]}.`);
    if (S.family.siblings.length) addLog(`Você tem ${S.family.siblings.length} irmão(s): ${S.family.siblings.map(s => esc(s.name.split(' ')[0])).join(', ')}.`);
    save(); render();
  },
  continueGame: () => { const s = loadSave(); if (!s) return renderCreate(); S = s; Q = []; TAB = 'perfil'; ANIM_AGE = null; render(); },
  menu: openMenu, importSave, exportSave,
  newLife: () => { closeModal(); clearSave(); S = null; CREATE = null; Q = []; renderCreate(); window.scrollTo(0, 0); },
  tab: t => { TAB = t; render(); window.scrollTo(0, 0); },
  ageUp, act: doActivity, enem: takeEnem, enroll, dropUni, oab: examOAB, residency: examResidency,
  apply: applyJob, concurso: takeConcurso, work: workAction, quit: quitJob, quitGig, openBiz: openBusiness, biz: bizAction, retire, habeas,
  meet, date: dateProspect, partner: partnerAction, fam: familyAction, child: childAction,
  pref: v => { S.pref = v; save(); },
  rent, parents: backToParents, buyHome, sellHome, buyVehicle, sellVehicle, invest
};

/* início */
/* blindagem: um erro inesperado numa ação não trava o jogo nem corrompe o save */
for (const k of Object.keys(G)) {
  const fn = G[k];
  G[k] = function (...args) {
    try { return fn.apply(this, args); }
    catch (e) {
      console.warn('[LifeCorp] erro em G.' + k, e);
      closeModal();
      try { if (S) render(); } catch (e2) { }
      toast('⚠️ Algo deu errado nessa ação, mas seu progresso está salvo.');
    }
  };
}

(function boot() {
  const s = loadSave();
  if (s && s.alive) { S = s; render(); }
  else renderCreate();
})();
</script>
</body>
</html>
